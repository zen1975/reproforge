claims:
  - id: "C1-remind-first-controller"
    statement: "A deterministic controller accumulates monitor log-odds, issues a reminder at first positive evidence, and allows intervention only when evidence persists after the reminder."
    acceptance_criteria: "Persistent cases must intervene only after a reminder; recovery cases must reset and avoid intervention; transitions must be deterministic and test-covered."
  - id: "C2-threshold-calibration"
    statement: "Threshold selection chooses the smallest threshold whose observed harm is within delta of minimum harm on a calibration split."
    acceptance_criteria: "Calibration counts harm only for baseline-correct cases, chooses the smallest qualifying threshold, uses the published threshold grid, and proves calibration IDs are disjoint from the frozen test split."
  - id: "C3-paper-level-performance"
    statement: "SOMA reduces reasoning tokens while maintaining or improving answer accuracy and improves abstention on unanswerable questions under the paper protocol."
    acceptance_criteria: "Paper-level reproduction requires authorized monitor access, pinned S2 revisions, legal benchmark access, disjoint splits, matched baselines, raw trajectories, and machine-checkable accuracy/token/abstention/cost evidence. Synthetic tests do not satisfy this criterion."
