claims:
  - id: "C1-visibility-detection-gap"
    statement: "Agents detect explicit-error tool failures substantially more often than well-formed silent corruptions."
    acceptance_criteria: "Paper-level reproduction requires independently generated agent trials under comparable loud/quiet fault conditions. Released-data audit may verify published aggregation but does not satisfy independent behavioral reproduction."
  - id: "C2-reasoning-detection-replanning"
    statement: "Matched reasoning variants detect faults less often but replan more often than instruct siblings, without a clear recovery gain."
    acceptance_criteria: "Paper-level reproduction requires matched within-family model execution and task-clustered analysis or a declared protocol-equivalent design."
  - id: "C3-fault-injection-semantics"
    statement: "A typed fault layer can inject one controlled fault while separating detection, replanning, recovery, and repeated-tool behavior."
    acceptance_criteria: "Mechanism verification requires deterministic one-shot faults, quiet corruption that changes returned content while preserving result shape/type and successful underlying state transition, plus executable scoring semantics for replanning, repetition, and state agreement."
