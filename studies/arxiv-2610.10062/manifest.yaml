claims:
  - id: "C1-one-shot-fault-contract"
    statement: "Typed faults separate loud error channels from well-formed quiet corruption while preserving state boundary."
    acceptance_criteria: "Synthetic injector fires once on first eligible step, loud faults do not execute, quiet fault mutates returned value only, and all five conditions execute."
  - id: "C2-detection-recovery-separation"
    statement: "Detection, clean-run-relative recovery, and repetition are separate quantities."
    acceptance_criteria: "Independent fixture measures detection and state agreement per scripted policy, including a negative no-retry baseline; no inference about model behavior."
  - id: "C3-paper-level-agent-contrast"
    statement: "Paper contrasts fault detection and recovery for matched reasoning/instruct agents on BFCL multi-turn."
    acceptance_criteria: "Requires legal BFCL environments, matched real models, clean paired baselines, blind detection coding, task-clustered analysis and paper-comparable trajectories; synthetic cannot pass."
