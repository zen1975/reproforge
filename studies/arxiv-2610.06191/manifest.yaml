claims:
  - id: "C1-judgment-action-dissociation"
    statement: "Tool-using agents can correctly judge repeated source outputs as useless while failing to turn those judgments into stopping decisions."
    acceptance_criteria: "Paper-level reproduction requires trajectory-level evidence that usefulness judgments and stopping actions are dissociated under the paper protocol or a clearly documented equivalent."
  - id: "C2-enforced-integration-rule"
    statement: "A harness-level rule that forces answering after five consecutive USELESS judgments makes stopping respond to evidence rather than only prompt/deadline behavior."
    acceptance_criteria: "Mechanism verification requires a deterministic gate that fires after exactly five consecutive USELESS judgments, resets after useful evidence, remains fired once triggered, and reduces unnecessary tool calls in persistent-failure scenarios without firing on shorter recovery scenarios."
  - id: "C3-time-matched-contrast"
    statement: "A time-matched stopping contrast can distinguish evidence-integrating stopping from clock/deadline-driven stopping."
    acceptance_criteria: "Protocol verification requires an executable implementation of the paper-defined stopping contrast or an explicitly bounded equivalent on trajectory records."
