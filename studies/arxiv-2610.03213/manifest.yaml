reproduction:
  implementation_type: "INDEPENDENT"
  official_code_used: false
  notes: "Authoritative arXiv metadata and full PDF inspected. ReproForge independently implements a deterministic lexical reference classifier and evaluates it on an independent hard synthetic candidate-level benchmark. This provides PARTIAL mechanism evidence only. The paper's Gemma 3 Base/GEPA/SFT/GRPO experiments and held-out server-disjoint benchmark remain unreproduced."
external_assets: []
claims:
  - id: "C1-task-tool-relevance"
    statement: "The study investigates a Small Language Model as a per-call classifier that evaluates a selected tool independently against an assigned task and emits a relevance signal for downstream enforcement."
    acceptance_criteria: "Full reproduction must implement a task-tool relevance classifier with the same input/output semantics established by the paper and evaluate it using the paper's reported protocol and metrics."
  - id: "C2-multi-tool-mcp-dataset"
    statement: "The study uses a novel dataset containing multi-tool tasks whose required tools span distinct Model Context Protocol servers."
    acceptance_criteria: "Full reproduction must reconstruct or independently create a protocol-equivalent multi-tool, multi-MCP evaluation set and document any unavoidable differences from the paper dataset."
  - id: "C3-specialization-methods"
    statement: "The study applies prompt optimization, supervised fine-tuning, and GRPO to optimize or specialize Small Language Models for task-tool relevance classification."
    acceptance_criteria: "Full reproduction must separately evaluate the applicable prompt-optimized, supervised-fine-tuned, and GRPO variants using exact or protocol-equivalent settings extracted from the full paper."
