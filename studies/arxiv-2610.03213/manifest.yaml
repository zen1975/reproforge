claims:
  - id: "C1-delegation-laundering"
    statement: "A keyed approval-token mechanism bound to dispatch context can eliminate delegation laundering in the reported paired replay evaluation."
    acceptance_criteria: "Independent reproduction observes zero successful delegation-laundering cases under a protocol materially equivalent to the paper's paired before/after replay design."
  - id: "C2-temporal-laundering"
    statement: "The approval-token mechanism can eliminate the paper's seeded session-identity-mismatch construction for temporal laundering."
    acceptance_criteria: "Independent reproduction observes zero successful seeded temporal-laundering cases and records the same dispatch fields needed to distinguish the mismatch."
  - id: "C3-scope-limit"
    statement: "A field-bound approval token does not by itself prevent scope laundering when the recorded dispatch fields remain unchanged."
    acceptance_criteria: "Independent reproduction demonstrates at least one scope-laundering construction that remains indistinguishable to the field-only verifier while preserving the recorded dispatch fields."
  - id: "C4-argument-limit"
    statement: "A field-bound approval token does not necessarily reduce argument laundering when the relevant divergence occurs below the observable dispatch boundary."
    acceptance_criteria: "Independent reproduction demonstrates an argument-laundering construction that passes the field-only verifier because the verifier lacks the lower-level provenance required to distinguish it."
