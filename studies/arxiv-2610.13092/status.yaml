current_boundary: "Free/lightweight verification is complete, now including one actual-Jev live protocol check (jev-live-systemone-check-v1, run locally 2026-10-14, sanitized evidence committed, integrity-verified in CI). The published-aggregate audit and synthetic fixtures still verify the accounting/mechanism contract. The live check resolved jev-1.13.0 and scored 36/36 on Test B and 24/24 final successes on Test C, but at ceiling: zero deviations, so the recovery, premature-completion and better-first-but-worse-final mechanisms were NOT exercised live, and there was no control. It is a toy-workflow protocol check, not an ALFWorld/AndroidWorld reproduction and not evidence about the paper's effect sizes or about Jev generalizing."
next_step: "(1) Optional lightweight follow-up as a NEW experiment id (jev-live-systemone-check-v2; v1 stays frozen): a harder, held-out fixture where first-choice errors, recovery and premature completion actually occur, plus a separately named LLM candidate-interface control. Keep the key local-only. (2) Then run a protocol-comparable real-system reproduction with actual Jev access and ALFWorld/AndroidWorld environments, preserving B/J and applicable C controls, repeated fixed-task runs, full failure-inclusive accounting, and held-out completion/recovery evidence."
