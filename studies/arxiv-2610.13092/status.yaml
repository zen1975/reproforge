current_boundary: "Free/lightweight verification is complete, now including a B/C/J analogue (v3a, replicated C-vs-J gap, B-vs-C non-discriminating) and an auxiliary-overhead experiment (v3b, Jev delivered-time advantage largely absorbed by a shared auxiliary stage; reliability gap concentrated in injected), plus a second, frozen and pre-registered actual-Jev stress test (jev-live-systemone-check-v2, run once locally 2026-10-14 against a named claude-haiku-5-5 LLM candidate-interface control: forced-trap recovery 87.2% Jev vs 97.2% control, gap concentrated in the injected family; Jev ~85% faster per decision but not better on delivered success; control outside the difficulty window, disclosed; not ALFWorld/AndroidWorld) and one actual-Jev live protocol check (jev-live-systemone-check-v1, run locally 2026-10-14, sanitized evidence committed, integrity-verified in CI). The published-aggregate audit and synthetic fixtures still verify the accounting/mechanism contract. The live check resolved jev-1.13.0 and scored 36/36 on Test B and 24/24 final successes on Test C, but at ceiling: zero deviations, so the recovery, premature-completion and better-first-but-worse-final mechanisms were NOT exercised live, and there was no control. It is a toy-workflow protocol check, not an ALFWorld/AndroidWorld reproduction and not evidence about the paper's effect sizes or about Jev generalizing."
next_step: "Lightweight verification is closed (v1, v2, v3a, v3b frozen; no more toy families, prompt tuning or control models). Next: a protocol-comparable real-system reproduction with actual Jev access and ALFWorld/AndroidWorld environments, preserving B/J and applicable C controls, repeated fixed-task runs, full failure-inclusive accounting, and held-out completion/recovery evidence. Rotate both API keys and delete the Keychain entries."
