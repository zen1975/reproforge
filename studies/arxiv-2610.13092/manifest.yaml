claims:
  - id: "C1-local-decision-efficiency"
    statement: "Jev substantially reduces action-selection cost and latency across the five evaluated agent families."
    acceptance_criteria: "Published aggregate audit must reproduce the reported decision-level reduction range from the paper tables within rounding tolerance."
  - id: "C2-task-level-efficiency-transfer"
    statement: "Local action-selection savings transfer unevenly to total task cost and latency because auxiliary reasoning, interaction and environment work can absorb them."
    acceptance_criteria: "Independent accounting must distinguish decision resources, auxiliary resources, environment/other time, and total task resources; it must flag cases where local savings fail to become task-level savings."
  - id: "C3-successful-delivery-efficiency"
    statement: "Per-attempt savings do not guarantee lower resource cost per delivered success when completion rates fall."
    acceptance_criteria: "Auditor must compute total resource / successful executions and detect the lower-attempt-cost but higher-cost-per-success paradox."
  - id: "C4-interface-vs-model"
    statement: "ALFWorld B/C/J comparisons separate candidate-list interface effects from the Jev decision-model effect."
    acceptance_criteria: "Protocol must preserve B-vs-C as interface contrast and C-vs-J as decision-model contrast rather than attributing both to Jev."
  - id: "C5-recovery-and-completion"
    statement: "Failed recovery and premature completion can turn local decision errors into task-level failures."
    acceptance_criteria: "Mechanism fixture must separately represent initial decision error, recovery opportunity, recovery outcome and completion verification; final outcome cannot be inferred from first-trial success alone."
