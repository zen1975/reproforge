  notes: "Independent state-machine and action-contract implementation derived from the paper and published prompts; no author implementation code is assumed."
claims:
  - id: "C1-structured-action-contract"
    statement: "Evidence construction uses exactly one structured action per round: CALL_PRIMITIVE, SYNTHESIZE, or ACCEPT_CONTEXT."
    acceptance_criteria: "Validator rejects malformed or mixed actions and enforces primitive/synthesis-specific required fields."
  - id: "C2-evidence-provenance"
    statement: "Successful evidence-producing operations add source-grounded evidence plus execution feedback; failures must not silently count as evidence."
    acceptance_criteria: "State transition must deduplicate evidence, retain source IDs/diagnostics, record every action/outcome, and add no evidence on failed execution."
  - id: "C3-computation-before-accept"
    statement: "When the task requires a derived computed result, retrieved operands alone are insufficient for ACCEPT_CONTEXT."
    acceptance_criteria: "External sufficiency contract rejects premature accept until the required derived evidence is present."
  - id: "C4-synthesis-specification-boundary"
    statement: "Because CompilerLM does not see the original task, SYNTHESIZE must preserve all task-specific constraints in evidence_goal/required_output."
    acceptance_criteria: "Incomplete synthesized-operation specifications are rejected before compilation."
  - id: "C5-trained-routing-performance"
    statement: "SFT+GRPO improves routing and downstream task success across heterogeneous benchmarks."
    acceptance_criteria: "Requires paper-relevant RouterLM training, compiler/answer models, benchmark environments, and evaluation; mechanism tests do not satisfy this claim."
