claims:
  - id: "C1-rsi-loop-contract"
    statement: "MASS alternates fixed-weight workflow optimization with post-training, and the updated model assumes executor, evaluator, and optimizer roles in the next cycle."
    acceptance_criteria: "Independent mechanism must preserve generation boundaries, same-generation homogeneous roles, train/test isolation, and explicit transition from workflow state to model-generation state."
  - id: "C2-elite-workflow-retention"
    statement: "Within a generation, workflow search retains the best-so-far workflow under sequential self-comparison while every proposal is still executed."
    acceptance_criteria: "Mechanism test must show incumbent replacement only on self-judged wins and preserve non-monotonic proposal execution."
  - id: "C3-self-vs-external-evaluation"
    statement: "Self-evaluation drives the RSI loop, while strong external judges are held out for final evaluation."
    acceptance_criteria: "Mechanism test must keep in-loop evaluator outputs separate from external closure evidence and reject external-evaluation leakage into training or workflow selection."
  - id: "C4-trajectory-selection"
    statement: "Multiple trajectories from retained workflows are pairwise ranked, with top trajectories used for SFT and a separate validation trajectory."
    acceptance_criteria: "Independent selection fixture must preserve task-local ranking, train/validation separation, and no test-task entry into SFT."
  - id: "C5-recursive-role-improvement"
    statement: "Task-solving-only post-training improves later task solving, workflow optimization, and self-evaluation across generations."
    acceptance_criteria: "Paper-level reproduction requires independently trained generations and held-out role-specific evaluation; mechanism-only tests cannot satisfy this claim."
  - id: "C6-coordination-internalization"
    statement: "Multi-agent coordination behaviors are internalized into model weights and can emerge under bare prompts."
    acceptance_criteria: "Requires trained-model behavioral audit on bare prompts and exposure lineage from SFT trajectories; synthetic mechanism tests alone do not satisfy this claim."
