  notes: "Independent audit implementation derived from the paper protocol. The paper states code/audit tooling will be released; no unreleased implementation details are assumed."
claims:
  - id: "C1-component-execution"
    statement: "A memory ablation is invalid if the claimed memory path is not observably exercised."
    acceptance_criteria: "Enabled-arm component counters must be non-zero when the claim depends on execution; an inert enabled arm must be detected."
  - id: "C2-run-independence"
    statement: "Stored traces from prior evaluation runs can contaminate fixed-seed reruns and create apparent memory gains."
    acceptance_criteria: "A pre-run store probe over evaluation keys/questions must detect contamination above the configured threshold."
  - id: "C3-single-axis-ablation"
    statement: "A memory ablation must vary only the named memory axis and must not confound arm with request shape, endpoint, parser, evidence source, or execution order."
    acceptance_criteria: "Serialized requests must differ only in the declared field and arm order must be counterbalanced."
  - id: "C4-measurement-floor"
    statement: "An apparent effect below replicate-level run-to-run variation is not resolvable merely because a within-run bootstrap is narrow."
    acceptance_criteria: "Audit must compare effect size against replicate-derived measurement floor separately from paired sampling uncertainty."
  - id: "C5-structural-applicability"
    statement: "Independent self-supplied benchmark items cannot establish persistent cross-query memory efficacy when reset correctness removes self-recall and remaining traces are unrelated."
    acceptance_criteria: "Audit must distinguish intention-to-treat memory enablement from questions where recall could actually retrieve task-relevant prior state."
