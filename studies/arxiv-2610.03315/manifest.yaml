  notes: "Authoritative arXiv metadata and full PDF inspected. ReproForge independently implements and stress-tests the deterministic tier-based budget allocation kernel. This is PARTIAL evidence for the fixed-budget serializer mechanism only. Full rule generation, trajectory normalization, MMR evidence selection, rubric-guided LLM judging, and public benchmark reproduction remain NOT_RUN."
