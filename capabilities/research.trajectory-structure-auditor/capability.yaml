id: "research.trajectory-structure-auditor"
version: "0.1.0"
name: "Trajectory Structure Auditor"
summary: "Experimental independent structural diagnostics from a subset of published TQS equations."
status: "experimental"
task_classes: ["agent-trajectory-evaluation", "trajectory-structure-diagnostics", "agent-training-data-curation"]
interface:
  inputs:
    steps: "array[{action,observation,files,error}]"
  outputs:
    OEC: "number|null"
    TTE: "number|null"
    SCP: "number"
    PED: "number|null"
runtime:
  kind: "python"
  entrypoint: "studies/arxiv-2610.13152/experiments/run_structural_audit.py:features"
  deterministic: true
  requirements: []
evidence:
  reproduction_status: "PARTIAL"
  studies: ["studies/arxiv-2610.13152"]
  evidence_paths:
    - "studies/arxiv-2610.13152/evidence/C1.structural-synthetic.evidence.json"
    - "studies/arxiv-2610.13152/evidence/tqs_structural_synthetic_v1.result.json"
implementation:
  path: "studies/arxiv-2610.13152/experiments/run_structural_audit.py"
  license: "Apache-2.0"
adapters:
  - kind: "python"
  - kind: "cli"
