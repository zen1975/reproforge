name: Qwen prompt optimization analogue

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.03213/experiments/run_qwen_prompt_optimization.py"
      - ".github/workflows/task-tool-qwen-prompt.yml"

jobs:
  prompt-opt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install "transformers==5.18.0" "torch==2.14.1" "accelerate>=1,<2"
      - name: Generate protocol-equivalent dataset
        run: python studies/arxiv-2610.03213/experiments/generate_protocol_equivalent_mcp.py
      - name: Optimize prompt on train-pool dev and evaluate held-out servers
        run: |
          set -o pipefail
          python studies/arxiv-2610.03213/experiments/run_qwen_prompt_optimization.py             | tee qwen_prompt_optimized_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-prompt-optimized-result
          path: qwen_prompt_optimized_result.json
          retention-days: 1
