name: Tool fault Qwen 0.5B analogue

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.10062/experiments/run_qwen0.5b_analogue.py"
      - ".github/workflows/tool-fault-qwen0.5b-analogue.yml"

jobs:
  qwen-tool-fault:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3"
          python -m pip install "transformers>=4.51,<5"
      - name: Run Qwen 0.5B tool-fault analogue
        run: |
          set -o pipefail
          python studies/arxiv-2610.10062/experiments/run_qwen0.5b_analogue.py             --model-id Qwen/Qwen2.5-0.5B-Instruct             --max-new-tokens 8             | tee tool_fault_qwen0.5b_analogue_v1.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: tool-fault-qwen0.5b-analogue-v1
          path: tool_fault_qwen0.5b_analogue_v1.result.json
          retention-days: 7
