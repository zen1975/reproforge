name: FOCUS model-backed analogue

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2609.37590/experiments/run_model_backed_analogue.py"
      - "capabilities/agent.decision-preserving-context-compressor/parser.py"
      - "capabilities/agent.decision-preserving-context-compressor/compressor.py"
      - ".github/workflows/focus-model-backed-analogue.yml"

jobs:
  qwen-analogue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model dependencies
        run: |
          python -m pip install "torch>=2.3,<3" "transformers>=4.51,<5"
      - name: Run Qwen 0.5B FOCUS analogue
        run: |
          set -o pipefail
          python studies/arxiv-2609.37590/experiments/run_model_backed_analogue.py \
            --model-id Qwen/Qwen2.5-0.5B-Instruct \
            --experiment-id focus-qwen0.5b-draft-analogue-v1 \
            --rollouts 3 \
            --temperature 0.7 \
            --max-new-tokens 256 \
            | tee focus_qwen0.5b_draft_analogue_v1.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: focus-qwen0.5b-draft-analogue-v1
          path: focus_qwen0.5b_draft_analogue_v1.result.json
          retention-days: 7
