name: Specialized task-tool SFT experiment

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.03213/experiments/generate_task_tool_sft_dataset.py"
      - "studies/arxiv-2610.03213/experiments/run_specialized_crossencoder_sft.py"
      - ".github/workflows/task-tool-sft.yml"

jobs:
  specialized-sft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install training dependencies
        run: python -m pip install "transformers==5.18.0" "torch==2.14.1" "numpy>=2,<3"
      - name: Generate deterministic family-disjoint dataset
        run: python studies/arxiv-2610.03213/experiments/generate_task_tool_sft_dataset.py
      - name: Run supervised specialization
        run: |
          python studies/arxiv-2610.03213/experiments/run_specialized_crossencoder_sft.py             | tee task_tool_specialized_sft_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: task-tool-specialized-sft-result
          path: task_tool_specialized_sft_result.json
