name: HAD Qwen 0.5B smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.02858/experiments/run_qwen0.5b_had_smoke.py"
      - ".github/workflows/had-qwen0.5b-smoke.yml"

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        mode: [distill-only, had]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3"
          python -m pip install "transformers>=4.51,<5" "peft>=0.14,<1"
      - name: Run Qwen 0.5B training smoke
        run: |
          set -o pipefail
          python studies/arxiv-2610.02858/experiments/run_qwen0.5b_had_smoke.py \
            --model-id Qwen/Qwen2.5-0.5B-Instruct \
            --mode ${{ matrix.mode }} \
            --steps 6 \
            --learning-rate 1e-5 \
            --beta 0.5 \
            --rho 0.5 \
            --version v2 \
            | tee had_qwen0.5b_${{ matrix.mode }}_smoke_v2.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: had-qwen0.5b-${{ matrix.mode }}-smoke-v2
          path: had_qwen0.5b_${{ matrix.mode }}_smoke_v2.result.json
          retention-days: 7
