name: Meta-skill bank mechanism

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2609.38143/experiments/run_meta_skill_bank.py"
      - ".github/workflows/meta-skill-bank-mechanism.yml"

jobs:
  mechanism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run meta-skill bank mechanism
        run: |
          set -o pipefail
          python studies/arxiv-2609.38143/experiments/run_meta_skill_bank.py             | tee meta_skill_bank_mechanism_v1.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: meta-skill-bank-mechanism-v1
          path: meta_skill_bank_mechanism_v1.result.json
          retention-days: 7
