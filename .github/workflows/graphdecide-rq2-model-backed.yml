name: GraphDecide RQ2 model-backed analogue

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.06354/experiments/run_rq2_model_backed_analogue.py"
      - ".github/workflows/graphdecide-rq2-model-backed.yml"

jobs:
  qwen-rq2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3"
          python -m pip install "transformers>=4.51,<5"
      - name: Run Qwen 0.5B RQ2 analogue
        run: |
          set -o pipefail
          python studies/arxiv-2610.06354/experiments/run_rq2_model_backed_analogue.py \
            --model-id Qwen/Qwen2.5-0.5B-Instruct \
            --max-new-tokens 8 \
            | tee graphdecide_rq2_qwen0.5b_analogue_v2.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: graphdecide-rq2-qwen0.5b-analogue-v2
          path: graphdecide_rq2_qwen0.5b_analogue_v2.result.json
          retention-days: 7
