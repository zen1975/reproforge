name: MASS Qwen 0.5B one-cycle LoRA analogue

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.12176/experiments/run_qwen0.5b_one_cycle_lora.py"
      - ".github/workflows/mass-qwen0.5b-one-cycle.yml"

jobs:
  mass-one-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU training dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3"
          python -m pip install "transformers>=4.51,<5" "peft>=0.13,<1"
      - name: Run one-cycle LoRA analogue
        run: |
          set -o pipefail
          python studies/arxiv-2610.12176/experiments/run_qwen0.5b_one_cycle_lora.py             --model-id Qwen/Qwen2.5-0.5B-Instruct             --steps 4             --lr 2e-5             | tee mass_qwen0.5b_one_cycle_lora_v1.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: mass-qwen0.5b-one-cycle-lora-v1
          path: mass_qwen0.5b_one_cycle_lora_v1.result.json
          retention-days: 7
