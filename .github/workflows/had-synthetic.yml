name: HAD synthetic protocol

on:
  workflow_dispatch:
  push:
    paths:
      - "capabilities/training.harness-aware-action-distillation/had.py"
      - "studies/arxiv-2610.02858/experiments/run_had_synthetic.py"
      - ".github/workflows/had-synthetic.yml"

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run HAD synthetic protocol
        run: |
          set -o pipefail
          python studies/arxiv-2610.02858/experiments/run_had_synthetic.py \
            | tee had_synthetic_protocol_v1.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: had-synthetic-protocol-v1
          path: had_synthetic_protocol_v1.result.json
          retention-days: 7
