name: Memory Qwen 0.5B key assignment

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.10265/experiments/run_qwen0.5b_key_assignment.py"
      - ".github/workflows/memory-qwen0.5b-key-assignment.yml"

jobs:
  qwen-key-assignment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3"
          python -m pip install "transformers>=4.51,<5"
      - name: Run Qwen 0.5B key assignment analogue
        run: |
          set -o pipefail
          python studies/arxiv-2610.10265/experiments/run_qwen0.5b_key_assignment.py             --model-id Qwen/Qwen2.5-0.5B-Instruct             --max-new-tokens 8             | tee memory_qwen0.5b_key_assignment_v1.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: memory-qwen0.5b-key-assignment-v1
          path: memory_qwen0.5b_key_assignment_v1.result.json
          retention-days: 7
