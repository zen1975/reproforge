name: Qwen GRPO smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.03213/experiments/run_qwen_grpo_smoke.py"
      - ".github/workflows/task-tool-qwen-grpo-smoke.yml"

jobs:
  grpo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TRL stack
        run: python -m pip install "trl==0.26.1" "peft>=0.18,<1" "datasets>=4,<5"
      - name: Generate protocol-equivalent dataset
        run: python studies/arxiv-2610.03213/experiments/generate_protocol_equivalent_mcp.py
      - name: Run real GRPO smoke
        run: |
          python studies/arxiv-2610.03213/experiments/run_qwen_grpo_smoke.py             | tee qwen_grpo_smoke_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-grpo-smoke-result
          path: qwen_grpo_smoke_result.json
          retention-days: 1
