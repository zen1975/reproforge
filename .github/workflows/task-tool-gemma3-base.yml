name: Gemma 3 1B protocol baseline

on:
  workflow_dispatch:

jobs:
  gemma-base:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require gated-model token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN missing. Accept Gemma license and configure repository secret HF_TOKEN."
            exit 2
          fi
      - name: Install
        run: python -m pip install "transformers==5.18.0" "torch==2.14.1" "accelerate>=1,<2"
      - name: Generate protocol-equivalent dataset
        run: python studies/arxiv-2610.03213/experiments/generate_protocol_equivalent_mcp.py
      - name: Run Gemma 3 1B baseline
        run: |
          python studies/arxiv-2610.03213/experiments/run_gemma3_protocol_baseline.py             | tee gemma3_protocol_base_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: gemma3-protocol-base-result
          path: gemma3_protocol_base_result.json
          retention-days: 1
