name: HAD harness signal contrast

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.02858/experiments/run_harness_signal_teacher_contrast.py"
      - ".github/workflows/had-harness-signal-contrast.yml"

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3"
          python -m pip install "transformers>=4.51,<5"
      - name: Run harness-signal contrast
        run: |
          set -o pipefail
          python studies/arxiv-2610.02858/experiments/run_harness_signal_teacher_contrast.py \
            --student-model Qwen/Qwen2.5-0.5B-Instruct \
            --teacher-model Qwen/Qwen2.5-1.5B-Instruct \
            | tee had_harness_signal_qwen_contrast_v2.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: had-harness-signal-qwen-contrast-v2
          path: had_harness_signal_qwen_contrast_v2.result.json
          retention-days: 7
