name: Blind specialization evaluation

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.03213/experiments/generate_task_tool_blind_v1.py"
      - "studies/arxiv-2610.03213/experiments/run_specialized_blind_eval.py"
      - ".github/workflows/task-tool-blind.yml"

jobs:
  blind-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "transformers==5.18.0" "torch==2.14.1" "numpy>=2,<3"
      - name: Generate frozen blind benchmark
        run: python studies/arxiv-2610.03213/experiments/generate_task_tool_blind_v1.py
      - name: Recreate family-disjoint training data
        run: python studies/arxiv-2610.03213/experiments/generate_task_tool_sft_dataset.py
      - name: Train and evaluate blind families
        run: |
          python studies/arxiv-2610.03213/experiments/run_specialized_blind_eval.py             | tee task_tool_blind_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: task-tool-blind-result
          path: task_tool_blind_result.json
