name: LiteTraj model-backed judge analogue

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.03315/experiments/run_model_backed_judge_analogue.py"
      - ".github/workflows/litetraj-model-backed-judge.yml"

jobs:
  qwen-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3"
          python -m pip install "transformers>=4.51,<5"
      - name: Run Qwen 0.5B judge analogue
        run: |
          set -o pipefail
          python studies/arxiv-2610.03315/experiments/run_model_backed_judge_analogue.py \
            --model-id Qwen/Qwen2.5-0.5B-Instruct \
            --max-new-tokens 192 \
            | tee litetraj_qwen0.5b_judge_analogue_v1.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: litetraj-qwen0.5b-judge-analogue-v1
          path: litetraj_qwen0.5b_judge_analogue_v1.result.json
          retention-days: 7
