name: FOCUS tiny-model negative analogue

on:
  workflow_dispatch:

jobs:
  analogue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inference dependencies
        run: python -m pip install "torch>=2.3,<3" "transformers>=4.51,<5"
      - name: Run SmolLM2 135M negative analogue
        run: |
          set -o pipefail
          python studies/arxiv-2609.37590/experiments/run_model_backed_analogue.py \
            --model-id HuggingFaceTB/SmolLM2-135M-Instruct \
            --experiment-id focus-smollm-draft-analogue-v2-strict \
            --rollouts 3 \
            --temperature 0.7 \
            --max-new-tokens 96 \
            | tee focus_smollm_draft_analogue_v2_strict.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: focus-smollm-draft-analogue-v2-strict
          path: focus_smollm_draft_analogue_v2_strict.result.json
          retention-days: 7
