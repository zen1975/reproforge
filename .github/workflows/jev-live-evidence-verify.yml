name: Jev live evidence integrity

# Verification only. The live Jev run happens locally; no API key or secret is used here.
on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.13092/evidence/jev_live_systemone_check_v1.result.json"
      - "studies/arxiv-2610.13092/experiments/jev_live_systemone_check_v1.fixture.json"
      - "studies/arxiv-2610.13092/experiments/run_jev_live_systemone_check.py"
      - "studies/arxiv-2610.13092/experiments/verify_jev_live_evidence.py"
      - "studies/arxiv-2610.13092/experiments/verify_jev_v2_evidence.py"
      - "studies/arxiv-2610.13092/experiments/jev_v2_*.py"
      - "studies/arxiv-2610.13092/experiments/jev_v3*.py"
      - "studies/arxiv-2610.13092/experiments/verify_jev_v3_evidence.py"
      - "studies/arxiv-2610.13092/experiments/verify_jev_v3b_evidence.py"
      - "studies/arxiv-2610.13092/experiments/jev_closure_metrics.py"
      - "studies/arxiv-2610.13092/evidence/jev_v2_*.json"
      - "studies/arxiv-2610.13092/evidence/jev_v3*.json"
      - ".github/workflows/jev-live-evidence-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify committed evidence against the frozen fixture
        run: python studies/arxiv-2610.13092/experiments/verify_jev_live_evidence.py
      - name: Verify committed v2 evidence (pilot + frozen test evidence)
        run: python studies/arxiv-2610.13092/experiments/verify_jev_v2_evidence.py
      - name: Verify committed v3a evidence (NOT_RUN until a local run is committed)
        run: python studies/arxiv-2610.13092/experiments/verify_jev_v3_evidence.py
      - name: Verify committed v3b evidence (NOT_RUN until a local run is committed)
        run: python studies/arxiv-2610.13092/experiments/verify_jev_v3b_evidence.py
      - name: Re-derive closure metrics from committed v3a evidence
        run: python studies/arxiv-2610.13092/experiments/jev_closure_metrics.py --prefix jev_v3a_test --arms jev control b --check studies/arxiv-2610.13092/evidence/jev_v3a_test_metrics.json
      - name: Re-derive closure metrics from committed v3b evidence (skipped until committed)
        run: |
          if [ -f studies/arxiv-2610.13092/evidence/jev_v3b_test_metrics.json ]; then
            python studies/arxiv-2610.13092/experiments/jev_closure_metrics.py --prefix jev_v3b_test --arms jev_O0 jev_O1 control_O0 control_O1 b_O0 b_O1 --check studies/arxiv-2610.13092/evidence/jev_v3b_test_metrics.json
          fi
