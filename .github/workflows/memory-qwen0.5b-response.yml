name: Memory Qwen 0.5B response propagation

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.10265/experiments/run_qwen0.5b_response_propagation.py"
      - ".github/workflows/memory-qwen0.5b-response.yml"

jobs:
  qwen-response:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3"
          python -m pip install "transformers>=4.51,<5"
      - name: Run Qwen 0.5B response propagation
        run: |
          set -o pipefail
          python studies/arxiv-2610.10265/experiments/run_qwen0.5b_response_propagation.py             --model-id Qwen/Qwen2.5-0.5B-Instruct             --max-new-tokens 16             | tee memory_qwen0.5b_response_propagation_v1.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: memory-qwen0.5b-response-propagation-v1
          path: memory_qwen0.5b_response_propagation_v1.result.json
          retention-days: 7
