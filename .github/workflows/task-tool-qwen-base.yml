name: Qwen 0.5B protocol baseline

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.03213/experiments/generate_protocol_equivalent_mcp.py"
      - "studies/arxiv-2610.03213/experiments/run_qwen_protocol_baseline.py"
      - ".github/workflows/task-tool-qwen-base.yml"

jobs:
  qwen-base:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install "transformers==5.18.0" "torch==2.14.1" "accelerate>=1,<2"
      - name: Generate protocol-equivalent dataset
        run: python studies/arxiv-2610.03213/experiments/generate_protocol_equivalent_mcp.py
      - name: Run Qwen 0.5B base baseline
        run: |
          set -o pipefail
          python studies/arxiv-2610.03213/experiments/run_qwen_protocol_baseline.py             | tee qwen_protocol_base_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-protocol-base-result
          path: qwen_protocol_base_result.json
          retention-days: 1
