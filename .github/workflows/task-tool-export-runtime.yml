name: Export specialized task-tool runtime

on:
  workflow_dispatch:

jobs:
  export-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "transformers==5.18.0" "torch==2.14.1" "numpy>=2,<3"
      - name: Generate deterministic training data
        run: python studies/arxiv-2610.03213/experiments/generate_task_tool_sft_dataset.py
      - name: Train export reload and smoke test
        run: |
          python studies/arxiv-2610.03213/experiments/export_specialized_runtime.py             | tee specialized_runtime_export_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: task-tool-specialized-runtime
          path: |
            artifacts/task-tool-specialized-minilm-v1/
            specialized_runtime_export_result.json
          retention-days: 1
