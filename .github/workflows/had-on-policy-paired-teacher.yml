name: HAD on-policy paired teacher

on:
  workflow_dispatch:
  push:
    paths:
      - "studies/arxiv-2610.02858/experiments/run_on_policy_paired_teacher.py"
      - ".github/workflows/had-on-policy-paired-teacher.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3"
          python -m pip install "transformers>=4.51,<5"
      - name: Run student-visited paired-teacher generation
        run: |
          set -o pipefail
          python studies/arxiv-2610.02858/experiments/run_on_policy_paired_teacher.py \
            --student-model Qwen/Qwen2.5-0.5B-Instruct \
            --teacher-model Qwen/Qwen2.5-1.5B-Instruct \
            --max-steps 4 \
            | tee had_on_policy_paired_teacher_qwen_v1.result.json
      - uses: actions/upload-artifact@v4
        with:
          name: had-on-policy-paired-teacher-qwen-v1
          path: had_on_policy_paired_teacher_qwen_v1.result.json
          retention-days: 7
